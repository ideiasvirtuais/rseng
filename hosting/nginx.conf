# Snippet Nginx — inclua no bloco `server { }` do seu domínio.
# Serve o pacote dist/client/ (ou dist/rseng-static.zip descompactado).
# Funciona em VPS, Coolify, Dokku, EasyApache, Webdock, Hetzner...

root /var/www/rseng;
index index.html _shell.html;

# SPA fallback: rotas inexistentes caem no _shell.html (exceto arquivos reais)
location / {
  try_files $uri $uri/ /_shell.html;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Assets com hash do Vite — imutáveis por 1 ano
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable" always;
}

# Imagens de public/ (sem hash) — revalidação diária
location ~* \.(png|jpe?g|webp|avif|gif|svg|ico)$ {
  expires 1d;
  add_header Cache-Control "public, must-revalidate" always;
}

# Tipos modernos (Apaches/Nginx antigos não declaram)
types {
  image/webp webp;
  image/avif avif;
  font/woff2 woff2;
}
