# Nginx da imagem Docker — espelho portátil de hosting/nginx.conf,
# adaptado para /usr/share/nginx/html (layout da imagem oficial nginx:alpine).
# O pacote dist/client/ já contém .htaccess/_redirects/web.config para os
# outros hosts; este arquivo cuida APENAS do container independente.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html _shell.html;

  # SPA fallback: arquivos reais passam direto, rotas caem no _shell.html
  location / {
    try_files $uri $uri/ /_shell.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Assets do Vite (com hash) — imutáveis por 1 ano
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # Imagens públicas — revalidação diária
  location ~* \.(png|jpe?g|webp|avif|gif|svg|ico)$ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate" always;
  }

  # Tipos modernos
  types {
    image/webp webp;
    image/avif avif;
    font/woff2 woff2;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
