name: "Build e Deploy FTP (KingHost) — staging + produção"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de deploy"
        type: choice
        required: true
        default: production
        options:
          - staging
          - production

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Push na main publica automaticamente em produção.
    # Pelo botão "Run workflow" o ambiente pode ser escolhido manualmente
    # (o padrão já é produção, para atualizar https://rsengenharia.eng.br/).
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      SITE_URL: "https://rsengenharia.eng.br"
      SITE_HEALTH_URL: "https://rsengenharia.eng.br/health.json"

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Configurar Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Instalar Dependencias"
        run: bun install --frozen-lockfile

      - name: "Rodar Build (SPA/FTP)"
        run: bun run build:ftp

      - name: "Validar artefatos (preflight FTP)"
        run: bun run verify:ftp

      # Confere se os Secrets existem antes de tentar conectar.
      # Nenhum valor de credencial é impresso no log.
      - name: "Conferir Secrets de publicação (FTP_HOST, FTP_USER, FTP_PASSWORD)"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.PROD_FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_HOST" ] || missing="$missing FTP_HOST"
          [ -n "$FTP_USER" ] || missing="$missing FTP_USER"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Secrets de FTP ausentes::Faltam os Secrets:$missing. Abra o repositorio ideiasvirtuais/rseng em Settings -> Secrets and variables -> Actions, cadastre/atualize esses valores com os mesmos dados do servidor KingHost (eles nao sao sincronizados automaticamente) e rode este workflow novamente."
            exit 1
          fi
          echo "OK - Secrets de publicacao presentes (os valores nao sao exibidos)."

      - name: "Validar configuração FTP (${{ env.DEPLOY_ENV }})"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST || 'ftp.rsengenharia.eng.br' }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME || 'rsengenharia' }}
          FTP_USERNAME: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME || 'rsengenharia' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.PROD_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || vars.FTP_PORT || '21' }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || vars.FTP_SECURE || 'false' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR || '/www' }}
          FTP_TIMEOUT: '60000'
        run: node scripts/test-ftp-connection.mjs

      - name: "Deploy via FTP (${{ env.DEPLOY_ENV }})"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST || 'ftp.rsengenharia.eng.br' }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME || 'rsengenharia' }}
          FTP_USERNAME: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME || 'rsengenharia' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.PROD_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || vars.FTP_PORT || '21' }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || vars.FTP_SECURE || 'false' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR || '/www' }}
          FTP_CONCURRENCY: ${{ secrets.FTP_CONCURRENCY || vars.FTP_CONCURRENCY || '1' }}
          FTP_MAX_RETRIES: ${{ secrets.FTP_MAX_RETRIES || vars.FTP_MAX_RETRIES || '5' }}
          FTP_RETRY_DELAY_MS: ${{ secrets.FTP_RETRY_DELAY_MS || vars.FTP_RETRY_DELAY_MS || '1500' }}
          FTP_TIMEOUT: '60000'
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST || vars.STAGING_FTP_HOST }}
          STAGING_FTP_USER: ${{ secrets.STAGING_FTP_USER || vars.STAGING_FTP_USER }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          STAGING_FTP_REMOTE_DIR: ${{ secrets.STAGING_FTP_REMOTE_DIR || vars.STAGING_FTP_REMOTE_DIR }}
          PROD_FTP_HOST: ${{ secrets.PROD_FTP_HOST || vars.PROD_FTP_HOST }}
          PROD_FTP_USER: ${{ secrets.PROD_FTP_USER || vars.PROD_FTP_USER }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          PROD_FTP_REMOTE_DIR: ${{ secrets.PROD_FTP_REMOTE_DIR || vars.PROD_FTP_REMOTE_DIR }}
        run: node scripts/deploy-env.mjs --env=${{ env.DEPLOY_ENV }} --force --delete

      - name: "Upload relatorio de deploy"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ftp-report-${{ env.DEPLOY_ENV }}
          path: |
            dist/deploy-ftp*.log
            dist/deploy-report*.json
            dist/deploy-report*.md
            dist/deploy-changelog*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: "Deploy para a Branch stable-website"
        if: env.DEPLOY_ENV == 'production'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: dist/client
          clean: true

      # Resumo final: mostra o que foi publicado e como conferir.
      # Não imprime nenhuma credencial.
      - name: "Resumo da publicação"
        if: always()
        run: |
          echo "Ambiente: ${DEPLOY_ENV}"
          echo "Site: ${SITE_URL}/"
          echo "Conferir versao publicada: ${SITE_HEALTH_URL}"
          echo "Lembrete: o botao Publish do Lovable nao envia arquivos para o FTP da KingHost."
          echo "Se alguma etapa acima ficou vermelha, envie o texto dessa etapa (sem a senha) para ajuste."
