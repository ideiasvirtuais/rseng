name: "Build e Deploy FTP (KingHost) + stable-website"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Configurar Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Instalar Dependencias"
        run: bun install --frozen-lockfile

      - name: "Rodar Build (SPA/FTP)"
        run: bun run build:ftp

      - name: "Validar artefatos (preflight FTP)"
        run: bun run verify:ftp

      # ── Deploy automatico via FTP para a KingHost ───────────────────────────
      - name: "Deploy via FTP (KingHost)"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_CONCURRENCY: ${{ secrets.FTP_CONCURRENCY }}
          FTP_MAX_RETRIES: ${{ secrets.FTP_MAX_RETRIES }}
        run: bun run deploy:ftp -- --delete

      - name: "Upload relatorio de deploy"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ftp-report
          path: |
            dist/deploy-ftp.log
            dist/deploy-report.json
            dist/deploy-report.md
          if-no-files-found: ignore
          retention-days: 30

      # ── Espelho estatico na branch stable-website (backup) ──────────────────
      - name: "Deploy para a Branch stable-website"
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: dist/client
          clean: true
