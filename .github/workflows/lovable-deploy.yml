name: "Build e Deploy FTP (KingHost) — staging + produção"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de deploy"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Push na main → produção (o site rsengenharia.eng.br deve refletir a main).
    # Staging continua disponível via execução manual (workflow_dispatch + staging).
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Configurar Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Instalar Dependencias"
        run: bun install --frozen-lockfile

      - name: "Rodar Build (SPA/FTP)"
        run: bun run build:ftp

      - name: "Validar artefatos (preflight FTP)"
        run: bun run verify:ftp

      # ── Validação antecipada da conexão FTP ─────────────────────────────────
      - name: "Validar conexão FTP (${{ env.DEPLOY_ENV }})"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || 'ftp.rsengenharia.eng.br' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || 'rsengenharia' }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || 'rsengenharia' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'sdf45f34hgrtD45d$d' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'false' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '/www' }}
          FTP_TIMEOUT: '60000'
        run: node scripts/test-ftp-connection.mjs

      # ── Deploy FTP no ambiente selecionado ──────────────────────────────────
      - name: "Deploy via FTP (${{ env.DEPLOY_ENV }})"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || 'ftp.rsengenharia.eng.br' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || 'rsengenharia' }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || 'rsengenharia' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'sdf45f34hgrtD45d$d' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'false' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '/www' }}
          FTP_CONCURRENCY: ${{ secrets.FTP_CONCURRENCY || '1' }}
          FTP_MAX_RETRIES: ${{ secrets.FTP_MAX_RETRIES || '5' }}
          FTP_RETRY_DELAY_MS: ${{ secrets.FTP_RETRY_DELAY_MS || '1500' }}
          FTP_TIMEOUT: '60000'
          # Overrides opcionais por ambiente (se existirem nos secrets)
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_USER: ${{ secrets.STAGING_FTP_USER }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          STAGING_FTP_REMOTE_DIR: ${{ secrets.STAGING_FTP_REMOTE_DIR }}
          PROD_FTP_HOST: ${{ secrets.PROD_FTP_HOST }}
          PROD_FTP_USER: ${{ secrets.PROD_FTP_USER }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          PROD_FTP_REMOTE_DIR: ${{ secrets.PROD_FTP_REMOTE_DIR }}
        run: node scripts/deploy-env.mjs --env=${{ env.DEPLOY_ENV }} --delete

      - name: "Upload relatorio de deploy"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ftp-report-${{ env.DEPLOY_ENV }}
          path: |
            dist/deploy-ftp*.log
            dist/deploy-report*.json
            dist/deploy-report*.md
            dist/deploy-changelog*.json
          if-no-files-found: ignore
          retention-days: 30

      # ── Espelho estatico na branch stable-website (somente produção) ────────
      - name: "Deploy para a Branch stable-website"
        if: env.DEPLOY_ENV == 'production'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: dist/client
          clean: true
